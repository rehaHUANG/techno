<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>小組計分板</title>
<style>
:root{--ink:#182b45;--muted:#718096;--line:#e4eaf1;--bg:#f4f7fb;--blue:#2864d7;--mint:#e5f6f0;--gold:#fff4d6}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:ui-sans-serif,"Noto Sans TC","Microsoft JhengHei",sans-serif}.wrap{max-width:1240px;margin:auto;padding:34px 26px 56px}.top{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:26px}.eyebrow{font-size:12px;letter-spacing:.15em;font-weight:800;color:var(--blue);text-transform:uppercase}.top h1{font-size:clamp(28px,4vw,40px);letter-spacing:-.04em;margin:7px 0}.top p{margin:0;color:var(--muted);font-size:14px}.actions{display:flex;gap:10px;align-items:center}.btn{border:1px solid var(--line);background:white;border-radius:11px;padding:10px 15px;color:var(--ink);font-weight:700;cursor:pointer}.btn:hover{border-color:#aebbd0}.btn.danger{color:#bb4c4c}.summary{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;margin-bottom:25px}.stat{background:#fff;border:1px solid var(--line);border-radius:15px;padding:14px 16px}.stat strong{font-size:25px}.stat label{display:block;color:var(--muted);font-size:12px;font-weight:700;margin-bottom:5px}.stat strong{font-size:25px}.stat small{font-size:13px;color:var(--muted);margin-left:6px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.team{background:#fff;border:1px solid var(--line);border-radius:17px;overflow:hidden;box-shadow:0 3px 12px #233b5910}.team-head{display:flex;justify-content:space-between;align-items:center;padding:17px 19px;background:linear-gradient(110deg,#fff,#f9fbff);border-bottom:1px solid var(--line)}.team-title{display:flex;gap:11px;align-items:center}.badge{width:37px;height:37px;border-radius:12px;background:#eaf0ff;color:var(--blue);display:grid;place-items:center;font-weight:900}.team-name{border:0;background:transparent;color:var(--ink);font-size:17px;font-weight:800;width:135px;padding:4px 2px}.team-name:focus,.member-name:focus{outline:2px solid #bcd0ff;border-radius:5px}.team-total{text-align:right}.team-total b{font-size:24px}.team-total span{display:block;color:var(--muted);font-size:11px}.members{padding:4px 19px 11px}.member{display:grid;grid-template-columns:minmax(90px,1fr) auto auto;align-items:center;gap:9px;padding:10px 0;border-bottom:1px solid #eef1f5}.member:last-child{border-bottom:0}.member-name{width:100%;min-width:0;border:0;background:transparent;font:600 14px inherit;color:var(--ink);padding:7px 4px}.score{min-width:38px;text-align:center;font-weight:800;font-size:16px;font-variant-numeric:tabular-nums}.stepper{display:flex;align-items:center;gap:5px}.step{width:30px;height:30px;border:1px solid var(--line);border-radius:9px;background:#fff;font-size:17px;color:#4d607b;cursor:pointer}.step:hover{background:#f1f5ff;border-color:#c5d4f4}.checkpoints{background:#f8fafc;padding:14px 19px 16px;border-top:1px solid var(--line)}.cp-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.cp-title strong{font-size:13px}.cp-title span{font-size:11px;color:var(--muted)}.cp-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.cp label{display:block;font-size:11px;color:var(--muted);margin-bottom:5px}.cp select{width:100%;border:1px solid #dfe6ef;background:white;border-radius:8px;padding:8px 7px;color:var(--ink);font-weight:700}.footer-note{text-align:center;color:var(--muted);font-size:12px;margin-top:18px}.toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,20px);background:#182b45;color:white;padding:11px 16px;border-radius:10px;opacity:0;transition:.2s;pointer-events:none;font-size:13px}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:760px){.wrap{padding:23px 15px 42px}.top{display:block}.actions{margin-top:16px}.grid{grid-template-columns:1fr}.summary{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.stat{padding:12px}.stat strong{font-size:21px}.stat small{display:block;margin:0}.team-name{width:120px}}@media(max-width:420px){.summary{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:380px){.member{grid-template-columns:minmax(70px,1fr) auto}.stepper{grid-column:1/-1;justify-content:flex-end}.cp-grid{gap:5px}.cp select{padding:7px 3px}}
</style>
</head>
<body><main class="wrap">
<header class="top"><div><div class="eyebrow">CLASSROOM SCOREBOARD</div><h1>小組計分板</h1><p>記錄每位成員的加減分，並為四個檢核點評分。</p></div><div class="actions"><button class="btn" id="exportBtn">匯出成績</button><button class="btn danger" id="resetBtn">重設全部</button></div></header>
<section class="summary" id="teamSummary" aria-label="各小組總分"></section>
<section class="grid" id="teams"></section><p class="footer-note">分數會自動儲存在此裝置的瀏覽器中。點擊組名或姓名即可修改。</p>
</main><div class="toast" id="toast"></div>
<script>
const KEY='class-scoreboard-v1';
const initial=()=>({teams:Array.from({length:6},(_,i)=>({name:`第 ${i+1} 組`,members:Array.from({length:5},(_,j)=>({name:`成員 ${j+1}`,score:0})),checks:[0,0,0,0]}))});
let data;try{data=JSON.parse(localStorage.getItem(KEY))||initial();if(data.teams.length!==6||data.teams.some(t=>t.members.length!==5))data=initial()}catch{data=initial()}
const $=s=>document.querySelector(s);const videoFiles=new Map();document.head.insertAdjacentHTML('beforeend','<style>.video-uploads{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 0 5px 4px}.video-upload{position:relative;display:flex;align-items:center;gap:7px;min-width:0;border:1px dashed #cbd6e4;background:#f9fbfe;border-radius:9px;padding:7px 9px;color:#60718a;font-size:11px;cursor:pointer}.video-upload input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}.video-upload .video-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.video-preview{grid-column:1/-1;width:100%;max-height:220px;border-radius:9px;background:#101828}</style>');const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){localStorage.setItem(KEY,JSON.stringify(data));render()}
function render(){const box=$('#teams');box.innerHTML='';const summary=$('#teamSummary');summary.innerHTML='';data.teams.forEach((team,ti)=>{let memberSum=team.members.reduce((a,m)=>a+(+m.score||0),0),checkSum=team.checks.reduce((a,n)=>a+(+n||0),0),total=memberSum+checkSum;const stat=document.createElement('div');stat.className='stat';stat.innerHTML=`<label>${esc(team.name)}</label><strong>${total}</strong><small>分</small>`;summary.appendChild(stat);const card=document.createElement('article');card.className='team';card.innerHTML=`<div class="team-head"><div class="team-title"><div class="badge">${String(ti+1).padStart(2,'0')}</div><input class="team-name" aria-label="小組名稱" value="${esc(team.name)}" data-team="${ti}"></div><div class="team-total"><b>${total}</b><span>小組總分</span></div></div><div class="members">${team.members.map((m,mi)=>`<div class="member"><input class="member-name" aria-label="成員姓名" value="${esc(m.name)}" data-member="${ti},${mi}"><div class="score">${m.score}</div><div class="stepper"><button class="step" aria-label="扣一分" data-delta="-1" data-at="${ti},${mi}">−</button><button class="step" aria-label="加一分" data-delta="1" data-at="${ti},${mi}">＋</button></div></div>`).join('')}</div><div class="checkpoints"><div class="cp-title"><strong>檢核點評分</strong><span>每項 1–6 分 · 小計 ${checkSum} 分</span></div><div class="cp-grid">${team.checks.map((v,ci)=>`<div class="cp"><label>檢核點 ${ci+1}</label><select aria-label="檢核點 ${ci+1} 分數" data-check="${ti},${ci}"><option value="0">未評分</option>${[1,2,3,4,5,6].map(n=>`<option value="${n}" ${+v===n?'selected':''}>${n} 分</option>`).join('')}</select></div>`).join('')}</div></div>`;card.querySelectorAll(".member").forEach((row,mi)=>{const uploads=document.createElement("div");uploads.className="video-uploads";uploads.innerHTML=[0,1].map(slot=>{const key=`${ti}-${mi}-${slot}`,item=videoFiles.get(key);return `<label class="video-upload">🎬 <span class="video-name">${item?esc(item.name):(slot===0?"this is my chair · 點擊上傳":(slot===1?"top、right side、rear、front view · 點擊上傳":`影片 ${slot+1} · 點擊上傳`))}</span><input type="file" accept="video/*" aria-label="上傳影片 ${slot===0?"this is my chair":slot===1?"top, right side, rear, front view":slot+1}" data-video="${key}"></label>${item?`<video class="video-preview" controls src="${item.url}"></video>`:""}`}).join("");row.appendChild(uploads)});box.appendChild(card)})}
$('#teams').addEventListener('click',e=>{const b=e.target.closest('[data-delta]');if(!b)return;const [t,m]=b.dataset.at.split(',').map(Number);data.teams[t].members[m].score=(+data.teams[t].members[m].score||0)+Number(b.dataset.delta);save()});
$('#teams').addEventListener('change',e=>{if(e.target.matches('[data-video]')){const file=e.target.files?.[0];if(file){const key=e.target.dataset.video,old=videoFiles.get(key);if(old)URL.revokeObjectURL(old.url);videoFiles.set(key,{name:file.name,url:URL.createObjectURL(file)});render()}}else if(e.target.matches('[data-team]'))data.teams[+e.target.dataset.team].name=e.target.value.trim()||`第 ${+e.target.dataset.team+1} 組`;else if(e.target.matches('[data-member]')){const[t,m]=e.target.dataset.member.split(',').map(Number);data.teams[t].members[m].name=e.target.value.trim()||`成員 ${m+1}`}else if(e.target.matches('[data-check]')){const[t,c]=e.target.dataset.check.split(',').map(Number);data.teams[t].checks[c]=+e.target.value}save()});
$('#resetBtn').addEventListener('click',()=>{if(confirm('確定重設所有小組、姓名與分數？此動作無法復原。')){data=initial();save();notify('已重設計分板')}});
$('#exportBtn').addEventListener('click',()=>{const rows=[['小組','成員','個人分數','檢核點1','檢核點2','檢核點3','檢核點4','小組總分']];data.teams.forEach(t=>t.members.forEach((m,i)=>rows.push([t.name,m.name,m.score,...(i===0?t.checks:['','','','']),i===0?t.members.reduce((a,x)=>a+(+x.score||0),0)+t.checks.reduce((a,x)=>a+(+x||0),''): ''])));const csv='\uFEFF'+rows.map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='小組成績.csv';a.click();URL.revokeObjectURL(a.href);notify('成績已匯出')});
let toastTimer;function notify(msg){const el=$('#toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),1800)}render();
</script></body></html>
